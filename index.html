<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potafo Accounts</title>
<script>
  // Apply saved theme before first paint (avoids a light flash)
  try {
    var t = JSON.parse(localStorage.getItem('potafo.accounts.theme'));
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">P</span>
      <span class="brand-name">Potafo <b>Accounts</b></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-user" id="userBox" hidden>
      <span class="user-email" id="userEmail"></span>
      <button class="link-btn" id="signOutBtn" type="button">Sign out</button>
    </div>
    <div class="sidebar-foot">
      <div class="sync" id="sync"><span class="sync-dot" id="syncDot"></span><span id="syncText">Saved in this browser</span></div>
      <button class="theme-btn" id="themeBtn" type="button"></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
      <h1 id="pageTitle">Potafo Accounts</h1>
      <button class="theme-btn" id="themeBtnTop" type="button" aria-label="Toggle dark mode"></button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Settings, Supabase library, core, store (all data), then modules, then start -->
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/searchable-select.js"></script>
<script src="js/date-input.js"></script>
<script src="js/export.js"></script>
<script src="js/xlsx-lite.js"></script>
<script src="js/book.js"></script>
<script src="js/modules/cashbook.js"></script>
<script src="js/modules/bankstatement.js"></script>
<script src="js/modules/operationalstatement.js"></script>
<script src="js/modules/ledgers.js"></script>
<script src="js/modules/deliverystaff.js"></script>
<!-- Reports: shared helpers first, then each page (vendors before the statement that uses them), then the shell -->
<script src="js/reports/core.js"></script>
<script src="js/reports/workbook.js"></script>
<script src="js/reports/vendors.js"></script>
<script src="js/reports/statement-xlsx.js"></script>
<script src="js/reports/groups.js"></script>
<script src="js/reports/mail.js"></script>
<script src="js/reports/monthly-statement.js"></script>
<script src="js/reports/saved.js"></script>
<script src="js/modules/reports.js"></script>
<script src="js/main.js"></script>
</body>
</html>
